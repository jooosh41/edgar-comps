name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # LibreOffice calculates the workbook's formulas so the number tests can check them.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Install the package
        run: pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes edgar_comps tests scripts
      - name: Test
        run: python -m pytest -v
